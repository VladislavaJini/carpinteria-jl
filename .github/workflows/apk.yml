name: Generar APK Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Herramientas y Compilar APK
        run: |
          npm install -g @bubblewrap/cli
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.carpinteriajl.app",
            "host": "vladislavajini.github.io",
            "name": "Carpinteria JL",
            "shortName": "Carpinteria JL",
            "startUrl": "/carpinteria-jl/",
            "display": "standalone",
            "themeColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "shortcuts": [],
            "iconUrl": "https://vladislavajini.github.io/carpinteria-jl/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "minSdkVersion": 21,
            "targetSdkVersion": 33,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://vladislavajini.github.io/carpinteria-jl/manifest.json",
            "fullScopeUrl": "https://vladislavajini.github.io/carpinteria-jl/"
          }
          EOF
          bubblewrap update --skip-icon-validation || true
          bubblewrap build || true

      - name: Buscar y Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CarpinteriaJL-APK
          path: |
            **/*.apk
            *.apk
