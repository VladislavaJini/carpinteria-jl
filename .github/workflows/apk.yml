name: Generar APK Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (OpenJDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compilar PWA a APK
        run: |
          npm install -g @bubblewrap/cli
          # Inicializa el proyecto respondiendo automáticamente con los valores por defecto
          echo -e "n\n\n\n\n\n\n\n" | bubblewrap init --manifest https://vladislavajini.github.io/carpinteria-jl/manifest.json --directory ./android-app --skip-icon-validation
          cd android-app
          bubblewrap build

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CarpinteriaJL-APK
          path: |
            android-app/**/*.apk
            *.apk
