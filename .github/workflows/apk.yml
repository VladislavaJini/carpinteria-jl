name: Generar APK Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compilar PWA a APK con PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwabuilder-cli
          pwabuilder package --url https://vladislavajini.github.io/carpinteria-jl/ --platform android --name "Carpinteria JL"

      - name: Subir Archivo APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CarpinteriaJL-APK
          path: output/android/
