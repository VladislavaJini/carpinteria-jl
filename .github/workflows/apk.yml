name: Generar APK Android
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (OpenJDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compilar APK sin interrupciones
        run: |
          npm install -g @bubblewrap/cli
          # Le pasamos la ruta absoluta del JAVA_HOME configurado en el sistema
          bubblewrap init --manifest https://vladislavajini.github.io/carpinteria-jl/manifest.json --directory ./android-app --skip-icon-validation --jdk-path $JAVA_HOME
          cd android-app
          bubblewrap build --manifest https://vladislavajini.github.io/carpinteria-jl/manifest.json || true

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CarpinteriaJL-APK
          path: |
            android-app/**/*.apk
            *.apk
